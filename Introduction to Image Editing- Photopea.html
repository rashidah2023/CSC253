<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Introduction to Photopea</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F9;--card:#fff;--ink:#1B1F2A;--mut:#5b6474;--acc:#0E8A7D;--hot:#D6336C;--line:#dde3ec;--ok:#dff5ee;--bad:#fde4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151c;--card:#1b2029;--ink:#e8ecf3;--mut:#9aa4b5;--line:#2b3340;--ok:#12382f;--bad:#431a27}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.2;margin:.2em 0 .5em}
header{background:var(--ink);color:#fff;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-family:'Space Grotesk',sans-serif}
nav{display:flex;gap:6px;overflow-x:auto;padding-top:6px}
nav button{background:none;border:1px solid #ffffff44;color:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--acc);border-color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .4s}
main{max-width:980px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:4px 14px}
summary{cursor:pointer;font-weight:700;padding:8px 0}
.tip,.rem,.mis{border-left:4px solid var(--acc);background:var(--ok);padding:8px 12px;border-radius:6px;margin:10px 0}
.rem{border-color:#c98a00;background:#fff3d1;color:#3a2c00}.mis{border-color:var(--hot);background:var(--bad)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-size:1rem}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font-size:1rem}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt.ok{background:var(--ok);border-color:var(--acc)}.opt.bad{background:var(--bad);border-color:var(--hot)}
.q{border-bottom:1px solid var(--line);padding:8px 0}.fb{margin:4px 0;color:var(--mut)}.score{font-weight:700}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
textarea{width:100%;min-height:80px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--line);padding:7px;text-align:left}
.tbl{overflow-x:auto}.badge{text-align:center;opacity:.35}.badge.got{opacity:1}.badge div{font-size:2rem}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin:3px;cursor:pointer;background:var(--card);color:var(--ink)}.chip.on{background:var(--hot);color:#fff;border-color:var(--hot)}
.pz{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pos{aspect-ratio:3/4;border-radius:8px;padding:10px;overflow:hidden}
.sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:2px}
:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
</style></head><body>
<header><b>🎨 Introduction to Photopea</b> <span id="tp" style="float:right;font-size:.85rem"></span><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);let cur=0,S={chk:{},ans:{},ref:{},rub:-1,theme:-1};
const PG=['Home','Module 1','Module 2','Module 3','Module 4','AI & Design','Quiz','Final Project'];
const T=(a,b)=>`<div class=tip>💡 <b>DESIGN TIP</b><br>${a}</div>`,R=a=>`<div class=rem>📌 <b>REMEMBER</b><br>${a}</div>`,X=a=>`<div class=mis>⚠️ <b>COMMON MISTAKE</b><br>${a}</div>`;
const M=[
{n:'Exploring Photopea Tools and Features',icon:'🏆',badge:'Photopea Explorer',obj:['Explain what Photopea is','Identify the interface areas','Tell raster from vector','Explain why layers matter','Open, save and export an image','Pick the right tool for a task'],
L:[['What is Photopea?','Photopea is a free image editor that runs in your browser at photopea.com. It opens PSD, JPG, PNG, WEBP and SVG files. The interface has a <b>menu bar</b> (top), <b>toolbar</b> (left), <b>options bar</b> (under the menu), <b>canvas</b> (centre), and <b>Layers</b> and <b>History</b> panels (right).'+T('Watch the options bar: it changes with every tool you pick.')],
['File formats','<b>PSD</b> keeps layers (your working file). <b>JPG</b> is small, no transparency. <b>PNG</b> supports transparency. <b>WEBP</b> is small and modern. <b>SVG</b> is vector and scales without blur.'+R('Save a PSD for editing, then export JPG or PNG for sharing.')],
['Raster vs vector, and layers','Raster images are made of pixels and blur when enlarged. Vector graphics use maths and stay sharp. <b>Layers</b> are stacked sheets: edit one without damaging the others.'+X('Painting everything on one layer. You cannot fix one part later.')]],
lab:['Lab 1 — Photopea Exploration','25–30 min',['Open Photopea','Create a new document','Import an image','Create at least three layers','Rename the layers','Move an object','Crop the image','Add text','Change the text colour','Save the project as PSD','Export as JPG or PNG']],
Q:[{q:'Which format keeps your layers?',o:['JPG','PSD','PNG'],a:1,e:'PSD stores layers for later editing.'},{q:'True or false: Vector graphics get blurry when enlarged.',o:['True','False'],a:1,e:'Raster images blur; vector graphics stay sharp.'},{q:'Which panel lists layers?',o:['History','Layers','Options bar'],a:1,e:'The Layers panel is on the right.'},{q:'You need transparency. Export as…',o:['JPG','PNG','None'],a:1,e:'PNG supports transparent backgrounds.'}],
ref:['Which Photopea tool did you find most useful?','Why is layer organisation important?']},
{n:'Editing an Existing Image',icon:'✂️',badge:'Image Editor',obj:['Crop, resize and straighten','Select and cut an object','Remove and replace a background','Adjust brightness, contrast and colour','Add text and organise layers'],
L:[['Size, crop and straighten','<b>Image size</b> changes all pixels (Image › Image Size). <b>Canvas size</b> adds or trims space around the image. Use <b>Crop</b> to improve composition and Straighten to fix tilted horizons.'+X('Enlarging a small image a lot. It becomes blurry.')],
['Selecting and removing backgrounds','Select the object, copy it to a new layer, then hide or delete the background. Use a <b>layer mask</b> instead of deleting so you can undo mistakes.<div class=tbl><table><tr><th>Situation</th><th>Method</th></tr><tr><td>Simple solid background</td><td>Magic Wand</td></tr><tr><td>Complex shape</td><td>Object Selection</td></tr><tr><td>Hair/fur</td><td>Select and Mask</td></tr><tr><td>Quick automatic removal</td><td>Remove Background</td></tr><tr><td>Precise manual editing</td><td>Layer Mask</td></tr></table></div>'],
['Adjust, add text, arrange','Use Image › Adjustments for Brightness/Contrast and colour. Add a title with the Text tool. Rename layers and drag them to change stacking order.'+T('Duplicate the original layer first, then edit the copy.')]],
lab:['Lab 2 — Image Transformation','40–45 min',['Open the image','Duplicate the original layer','Rename layers','Remove the original background','Add a new background','Resize and reposition the main object','Adjust brightness and contrast','Add a title','Add a subtitle','Export the final image']],
ch:'<b>Mini Challenge (25 min):</b> A local café wants a promotional social media image for its new iced coffee. Needs: product image, background, main title, short promo message, suitable colour, at least 3 layers.',
Q:[{q:'Best method for hair or fur?',o:['Magic Wand','Select and Mask','Crop'],a:1,e:'Select and Mask refines soft edges like hair.'},{q:'Why use a layer mask instead of Eraser?',o:['It is non-destructive','It is faster to forget','It shrinks files'],a:0,e:'Masks hide pixels and can be undone.'},{q:'Canvas size changes…',o:['The space around the image','Only colours','Fonts'],a:0,e:'Canvas size adds or trims working space.'},{q:'True or false: Duplicate the original before editing.',o:['True','False'],a:0,e:'It keeps a safe copy.'}],
ref:['Which background method worked best for your image?','What did you improve most?']},
{n:'Applying Effects to Images and Text',icon:'✨',badge:'Effects Master',obj:['Use adjustments, blur and blend modes sparingly','Style text clearly','Apply contrast, alignment, repetition, proximity, balance, hierarchy, white space','Choose suitable colours'],
L:[['Image and text effects','Image: Brightness/Contrast, Hue/Saturation, Levels, Curves, Gaussian Blur, Sharpen, Opacity, Blend modes. Text: font, size, weight, colour, alignment, letter and line spacing, drop shadow, stroke, outer glow, gradient.'+R('Effects should support the message, not distract from it.')],
['Design principles','<b>Contrast</b> makes key items stand out. <b>Alignment</b> creates order. <b>Repetition</b> builds consistency. <b>Proximity</b> groups related info. <b>Balance</b> can be symmetrical or asymmetrical. <b>Hierarchy</b>: title, supporting info, extra info, call-to-action. <b>White space</b> lets content breathe.'],
['Colour','Primary, secondary, complementary (opposites), analogous (neighbours), warm and cool colours. Colours carry feelings: blue feels trustworthy, red feels urgent. Always check text/background contrast.'+T('Use no more than 2–3 font families in a simple poster.')]],
lab:['Lab 3 — Make It Better','30–35 min',['Fix fonts (max 2–3)','Write a clear title','Choose a suitable palette','Align all elements','Apply one image effect','Apply one text effect','Improve spacing','Set a clear hierarchy']],
Q:[{q:'Which helps important text stand out?',o:['Low contrast','High contrast','More fonts'],a:1,e:'Contrast separates important elements.'},{q:'True or false: Use as many fonts as possible.',o:['True','False'],a:1,e:'Two or three families keeps it readable.'},{q:'Grouping related info is…',o:['Proximity','Repetition','Blur'],a:0,e:'Proximity places related items close together.'},{q:'Opposite colours on the wheel are…',o:['Analogous','Complementary','Warm'],a:1,e:'Complementary colours sit opposite.'}],
ref:['What makes a poster visually effective?','What did you change in Lab 3 and why?']},
{n:'Final Project: Create a Poster',icon:'🎨',badge:'Poster Designer',obj:['Plan and build a complete poster','Combine editing, effects and layout','Submit PSD, JPG/PNG and explanation'],
L:[['Plan','Pick a theme on the Final Project page. Sketch a layout: title, image, supporting text, call-to-action. Use A4 (2480 × 3508 px, 300 DPI) or 1080 × 1350 px for social media.'],
['Build','Use at least 4 named layers, one image-editing technique, one image effect, one text effect, a clear hierarchy and a call-to-action.']],
lab:['Project deliverables','Lab time','Poster built in Photopea','PSD file saved','JPG/PNG exported','Short design explanation written'],
Q:[{q:'Recommended social media size?',o:['1080 × 1350 px','100 × 100 px'],a:0,e:'It fits portrait feeds.'},{q:'Minimum layers in the poster?',o:['2','4','10'],a:1,e:'At least four layers are required.'}],
ref:['How did you improve your design?','How can AI assist the design process?']}];
const NOTES=[
[["A. Start Photopea and learn the screen",["Open a browser and go to photopea.com.","Click New Project on the start screen (or File › New).","Find the Menu bar (top), Options bar (below it), Toolbar (left), Canvas (centre), Layers and History panels (right).","Click different tools in the Toolbar and watch the Options bar change."]],
["B. Create a document",["Choose File › New.","Name it, e.g. Lab1_YourName.","Set Width 1080 and Height 1080, Resolution 72 for screens (300 for print), Background White.","Click Create."]],
["C. Import an image and make layers",["Choose File › Open & Place to add an image as its own layer (File › Open opens it as a new document).","Click the New Layer icon at the bottom of the Layers panel two more times to get three layers.","Double-click a layer name, type a new name (e.g. Photo, Shape, Title) and press Enter.","Click the eye icon beside a layer to hide or show it."]],
["D. Move, crop and add text",["Press V for the Move Tool. Click a layer in the Layers panel, then drag its object on the canvas.","Press C for the Crop Tool, drag the box around the part to keep, then press Enter.","Press T for the Text Tool, click the canvas, type your words.","In the Options bar choose the font and size. Click the colour box to change the text colour, then click OK."]],
["E. Save and export",["Choose File › Save (Ctrl+S) or File › Save as PSD to keep layers.","Choose File › Export as › PNG (or JPG).","Set quality (JPG about 80%) and click Save.","Check both files appear in your Downloads folder."]]],
[["A. Open the image and check size",["Choose File › Open and pick the sample image.","Choose Image › Image Size to see width and height in pixels.","Keep the chain (link) icon on to keep proportions, type a new width, click OK.","Choose Image › Canvas Size to add or trim space around the image."]],
["B. Straighten and crop",["If the horizon is tilted, press Ctrl+T (Free Transform), move the pointer outside a corner and drag to rotate. Press Enter.","Press C for Crop, drag to remove unwanted edges, press Enter."]],
["C. Duplicate and rename layers",["Right-click the photo layer › Duplicate Layer, or press Ctrl+J.","Double-click the copy and rename it (e.g. Subject).","Rename the lower one Original and click its eye icon to hide it for safety."]],
["D. Remove the background",["Pick a method: Magic Wand (W) for a plain background, Object Selection for a subject.","Magic Wand: click the background, set Tolerance about 20–30, hold Shift to add more areas.","Object Selection: drag a rough box around the subject and wait for the outline.","Choose Select › Select and Mask to refine hair or edges, then Output to Layer Mask.","Alternatively, with the subject selected, click the Add Layer Mask icon at the bottom of the Layers panel.","If your version has Edit › Remove Background (or a button in the Options bar), use it for a quick result, then tidy the mask with a Brush (B): black hides, white reveals."]],
["E. Add a new background",["File › Open & Place a new background image, or press G and drag a gradient on a new layer.","Drag the background layer below the Subject layer in the Layers panel.","Press Ctrl+T to resize it, hold Shift to keep proportions, then press Enter."]],
["F. Resize, adjust and add text",["Select the Subject layer, press Ctrl+T, hold Shift and drag a corner to resize, drag inside to move. Press Enter.","Choose Image › Adjustments › Brightness/Contrast and move the sliders gently.","Use Image › Adjustments › Hue/Saturation to tune colour.","Press T and add a title, then a smaller subtitle on another text layer.","Export with File › Export as › PNG or JPG."]],
["G. Cut, copy and paste an object",["Select the object with the Lasso (L) or Object Selection tool.","Press Ctrl+C to copy, then Ctrl+V to paste. Photopea puts the pasted object on a new layer.","To cut it from the original instead, press Ctrl+X, then Ctrl+V.","To make the new layer without deleting anything, press Ctrl+J while the selection is active.","Rename the new layer, e.g. Cutout, and use the Move Tool (V) to position it.","Press Ctrl+D to deselect when finished."]],
["H. Method 1: Magic Wand (plain backgrounds)",["Duplicate the photo layer (Ctrl+J) and hide the original.","Press W and choose the Magic Wand in the Options bar.","Set Tolerance to about 25. Tick Contiguous so it only picks connected areas.","Click the background. Hold Shift and click again to add missed areas, or Alt to subtract.","Choose Select › Modify › Expand (1–2 px) if a coloured fringe remains.","Press Delete to remove the background, or click the Add Layer Mask icon after inverting with Select › Inverse (Ctrl+Shift+I)."]],
["I. Method 2: Object Selection + layer mask",["Duplicate the photo layer.","Press W and choose the Object Selection tool.","Drag a rectangle around the person or product. Photopea outlines it automatically.","Check the outline. Hold Shift and drag over missed parts to add them.","Click the Add Layer Mask icon at the bottom of the Layers panel. The background is hidden, not deleted.","Press B for Brush and click the mask thumbnail. Paint black to hide more, white to bring parts back. Press X to swap black and white."]],
["J. Method 3: Hair and fur with Select and Mask",["Make a rough selection with Object Selection first.","Choose Select › Refine Edge (Select and Mask).","Use the Refine/Edge brush and paint over the hair edges.","Increase Smooth or Feather slightly (1–2 px), and tick Decontaminate Colors if offered.","Set Output To: Layer Mask and click OK.","Place a dark background below to check for white edges, then fix with a small black or white brush on the mask."]],
["K. Promo graphic walkthrough (café iced coffee)",["Create a 1080 × 1350 px document.","Place the coffee image and remove its background with a method above.","Add a background: press G, choose a warm gradient (cream to brown) on a new layer, and drag it below the coffee layer.","Resize the coffee with Ctrl+T (hold Shift) and place it slightly off-centre.","Add a big title, e.g. Iced Coffee Time, with the Text Tool (T).","Add a short message, e.g. Buy one, get one free this week, in a smaller size.","Check you have at least 3 named layers: Background, Coffee, Title.","Export as PNG."]]],
[["A. Image effects",["Select the layer to change.","Brightness/Contrast: Image › Adjustments › Brightness/Contrast.","Levels: Image › Adjustments › Levels, drag the black and white sliders inward to add punch.","Blur a background: Filter › Blur › Gaussian Blur, radius 3–8 px, then OK.","Sharpen a subject: Filter › Sharpen › Sharpen.","Lower Opacity in the Layers panel, or change the Blend Mode (try Multiply or Overlay) in the drop-down above the layers."]],
["B. Text effects",["Select the text layer and set font, size, weight, alignment in the Options bar.","Open Window › Character to adjust letter spacing and line spacing.","Double-click the text layer (or click the fx icon) to open Blending Options.","Tick Drop Shadow, then lower Opacity and Distance so it stays subtle.","Tick Stroke to add an outline, or Gradient Overlay for gradient text.","Make sure text contrast against the background stays strong."]],
["C. Fix a poor poster (Lab 3)",["Open the poor poster file.","Delete extra fonts: keep one heading font and one body font.","Select text layers, then use the Move Tool options bar Align buttons to align them.","Increase the title size so it is clearly the biggest item.","Apply a calm palette of 2–3 colours using the Eyedropper (I) and Paint Bucket (G).","Add one image effect and one text effect only.","Add space between groups. Export the result and write what you changed and why."]],
["D. Hue/Saturation and Curves in detail",["Select the photo layer. Choose Image › Adjustments › Hue/Saturation.","Move Saturation slightly right to make colours richer, or left for a calmer look. Avoid extreme values.","Use Hue only to shift a colour, e.g. to match the brand colour.","Choose Image › Adjustments › Curves.","Click the middle of the diagonal line and drag it up a little to brighten, or down to darken.","For more contrast, make a gentle S-shape: pull the top part up and the bottom part down.","Click OK. Toggle the layer eye or use History to compare before and after."]],
["E. Blend modes step by step",["Place a texture or colour layer above your photo.","Open the blend mode drop-down at the top of the Layers panel (it says Normal).","Try Multiply to darken, Screen to lighten, and Overlay to add contrast and colour.","Lower the layer Opacity to 30–60% until the effect is subtle.","Keep the effect only if it supports your message."]],
["F. Build a text hierarchy",["Press T and type the main title. Use a bold sans-serif at the largest size.","Create a second text layer for the subtitle at about half the title size.","Create a third layer for details (date, venue) at a smaller size.","Create a fourth layer for the call-to-action, e.g. Register Now, and put it on a coloured shape (U for Shape Tool) for emphasis.","In Window › Character, increase letter spacing slightly for headings and set line spacing to about 120% for paragraphs.","Use Alignment in the Options bar: left-align everything for a clean look.","Squint at the poster: you should still see the title first."]],
["G. Choose and apply a colour palette",["Pick a base colour for the background and a contrasting accent for the call-to-action.","Click the foreground colour box and type a hex value (e.g. #0B1D3A).","Use the Eyedropper (I) on your photo to reuse a colour from it.","Fill shapes with the Paint Bucket (G) or by selecting the layer and using Edit › Fill.","Use the 60-30-10 rule: 60% main colour, 30% second colour, 10% accent.","Check readability: light text on dark, or dark text on light. Avoid red text on green."]],
["H. Align and space elements",["Choose View › Rulers, then View › Show › Guides.","Drag from the left ruler to place a guide on the margin, and repeat on the right.","Snap each text layer to the guides by dragging with the Move Tool (V).","Select several layers (hold Ctrl or Shift in the Layers panel) and use the align buttons in the Options bar.","Leave equal gaps between groups and generous margins so the poster has white space.","Check proximity: keep related lines close together and unrelated blocks further apart."]]],
[["Step 1. Create the poster file",["Choose File › New.","Choose A4 at 2480 × 3508 px and 300 resolution (or 1080 × 1350 px for social media).","Name it Poster_YourName and click Create."]],
["Step 2. Build the background and image",["Fill the background with a colour or gradient (G).","Place your main image with File › Open & Place.","Remove its background with Object Selection or a layer mask.","Apply one adjustment, e.g. Brightness/Contrast."]],
["Step 3. Add text and effects",["Add the title with the Text Tool (T) in the largest size.","Add supporting text and a call-to-action (e.g. Register Now).","Apply one text effect (Drop Shadow or Stroke) in Blending Options.","Check alignment and spacing."]],
["Step 4. Organise and submit",["Rename every layer (at least 4).","Turn on View › Show › Guides if you want alignment lines.","Save with File › Save as PSD.","Export with File › Export as › PNG or JPG.","Write 3–5 sentences explaining your design choices, then submit all three files."]]]];
const TOOLS='Move|↔️|Moves layers|Repositioning objects|Wrong layer selected\nMarquee|⬛|Rectangle/ellipse selections|Selecting regions|Forgetting to deselect\nLasso|➰|Freehand selections|Irregular shapes|Shaky edges\nMagic Wand|🪄|Selects similar colours|Solid backgrounds|Tolerance too high\nObject Selection|🎯|Selects a subject|People and products|Not refining edges\nCrop|✂️|Trims the image|Better composition|Cropping too tight\nEyedropper|💧|Picks a colour|Matching colours|Sampling wrong layer\nBrush|🖌️|Paints pixels|Retouching, masks|Painting on the wrong layer\nEraser|🧽|Erases pixels|Quick cleanup|Destroying pixels permanently\nClone Stamp|📎|Copies pixels|Removing blemishes|Visible repeating patterns\nGradient|🌈|Blends colours|Backgrounds|Harsh colours\nPaint Bucket|🪣|Fills areas|Flat colour|Gaps in the fill\nPen|🖊️|Precise paths|Clean shapes|Too many anchor points\nShape|🔷|Vector shapes|Buttons, frames|Stretching unevenly\nText|🔤|Adds text|Titles and captions|Tiny text\nZoom|🔍|Zooms the view|Detail work|Zooming changes the image (it does not)\nHand|✋|Pans the canvas|Moving the view|Using Move instead'.split('\n').map(x=>x.split('|'));
const SC=[['Remove the background from a product image with a plain white backdrop.',['Magic Wand','Gradient','Crop','Clone Stamp'],0,'Magic Wand selects similar solid colours.'],['Cut out a person with a complex outline.',['Object Selection','Paint Bucket','Hand','Zoom'],0,'Object Selection detects subjects.'],['Trim empty space around a photo.',['Crop','Eraser','Text','Eyedropper'],0,'Crop removes unwanted edges.'],['Copy the exact blue from a logo.',['Eyedropper','Brush','Lasso','Move'],0,'Eyedropper samples colour.'],['Remove a small spot from a photo.',['Clone Stamp','Crop','Shape','Gradient'],0,'Clone Stamp copies nearby pixels.'],['Add a headline to a poster.',['Text','Clone Stamp','Hand','Gradient'],0,'Text adds editable type.'],['Create a smooth colour-fade background.',['Gradient','Zoom','Marquee','Pen'],0,'Gradient blends colours.'],['Move the subject to a new spot.',['Move','Crop','Eraser','Eyedropper'],0,'Move repositions layers.']].map(s=>{const c=s[1][s[2]],o=[...s[1]].sort((a,b)=>a.length-b.length||a.localeCompare(b));return{q:s[0],o,a:o.indexOf(c),e:s[3]}});
const PAL=[['Food poster',['<i class=sw style="background:#e4572e"></i><i class=sw style="background:#f3a712"></i> Warm red + orange','<i class=sw style="background:#3a4a8c"></i><i class=sw style="background:#7b2cbf"></i> Dark blue + purple'],0,'Warm colours feel appetising.'],['Technology poster',['<i class=sw style="background:#0b1d3a"></i><i class=sw style="background:#00c2ff"></i> Navy + cyan','<i class=sw style="background:#f3a712"></i><i class=sw style="background:#e4572e"></i> Orange + red'],0,'Cool, dark tones feel modern.'],['Sports poster',['<i class=sw style="background:#ff6b00"></i><i class=sw style="background:#111"></i> Orange + black','<i class=sw style="background:#d8e2dc"></i><i class=sw style="background:#fff"></i> Pale grey + white'],0,'High energy needs strong contrast.'],['Education poster',['<i class=sw style="background:#2a6f97"></i><i class=sw style="background:#f2e8cf"></i> Blue + soft cream','<i class=sw style="background:#ff00ff"></i><i class=sw style="background:#00ff00"></i> Magenta + lime'],0,'Calm tones aid reading.'],['Event poster',['<i class=sw style="background:#6a0572"></i><i class=sw style="background:#ffd166"></i> Purple + gold','<i class=sw style="background:#888"></i><i class=sw style="background:#999"></i> Two greys'],0,'Complementary colours create excitement.']].map(p=>({q:p[0],o:p[1],a:p[2],e:p[3]}));
const FQ=['Is the message clear?','Is the title easy to understand?','Is important information included?','Is there a clear visual hierarchy?','Is the colour scheme appropriate?','Is the text readable?','Are images high quality?','Is there enough white space?','Are elements aligned?','Are layers organised?','Are layers named?','Is the resolution appropriate?','Is the final file exported correctly?'];
const RB=[['Content/message',15,'Message is clear, accurate and includes a call-to-action.'],['Image editing',15,'Clean cutouts, sensible adjustments and good resolution.'],['Typography',15,'2–3 fonts, readable sizes, clear hierarchy.'],['Colour',15,'Harmonious palette with strong text contrast.'],['Composition/layout',15,'Alignment, balance, focal point, white space.'],['Creativity',10,'Original idea, not just defaults.'],['Technical execution',10,'Named layers, correct size, PSD and export submitted.'],['AI/technology integration and responsible use',5,'AI used as a helper, checked and acknowledged.']];
const TH=['Technology Event','Campus Event','Cybersecurity Awareness','Environmental Awareness','Sports Event','Food Promotion','AI Awareness','Mental Well-being Awareness','Tourism Promotion','Student Club Event'];
const AIA=[['A — Generate Design Ideas','Suggest 5 creative poster concepts for a university technology event.','Pick one idea and build it by hand in Photopea.'],['B — Colour Palette','Suggest a professional colour palette for a cybersecurity awareness poster. Explain the purpose of each colour.','Evaluate the answer; apply only what suits your design.'],['C — Poster Text','Create a short headline, subtitle and call-to-action for a university AI workshop.','Edit the text before using it.'],['D — Image Generation','Describe the image you need for your poster.','Check usage rights, avoid misleading or inappropriate images, acknowledge AI content where required, verify facts.']];
const DK=[['Typography','Serif fonts have small strokes; sans-serif is clean. Pair one heading font with one body font. Keep sizes readable and line spacing comfortable.'],['Image quality','Resolution is pixels per inch; pixel dimensions set size. Keep aspect ratio when resizing. JPG compresses, PNG keeps transparency.'],['Composition','Rule of thirds, one focal point, a grid for alignment, and white space.'],['Colour and accessibility','Use harmony, strong text/background contrast, never rely on colour alone, use readable sizes, and add alt text for web.'],['Branding','Repeat colours, fonts and logo placement to build identity.']];
const SES=[['0–10','Introduction / objectives'],['10–25','Instructor demonstration'],['25–50','Guided practice'],['50–80','Individual exercise'],['80–105','Mini challenge'],['105–115','Quiz'],['115–120','Save, submit, reflect']];
function cnt(p){return Object.keys(S.chk).filter(k=>S.chk[k]&&k.startsWith(p)).length+Object.keys(S.ans).filter(k=>k.startsWith(p)).length}
function pct(i){const m=M[i],n=i+1,t=m.L.length+m.lab.length-2+m.Q.length;return Math.min(100,Math.round((cnt('l'+n+'-')+cnt('e'+n+'-')+cnt('q'+n+'-'))/t*100))}
function projDone(){return FQ.every((_,i)=>S.chk['p-'+i])}
function all(){return Math.round(([0,1,2,3].reduce((a,i)=>a+pct(i),0)+(projDone()?100:0))/5)}
function bar(p){return `<div class=bar><i style="width:${p}%"></i></div>`}
function quiz(a,p){return a.map((x,i)=>{const k=p+i,v=S.ans[k];return `<div class=q><b>${i+1}. ${x.q}</b>${x.o.map((o,j)=>`<button class="opt ${v==null?'':j==x.a?'ok':v==j?'bad':''}" ${v==null?'':'disabled'} onclick="ans('${k}',${j})">${o}</button>`).join('')}<p class=fb>${v==null?'':(v==x.a?'✅ Correct. ':'❌ Not quite. ')+x.e}</p></div>`}).join('')+`<p class=score>Score: ${a.filter((x,i)=>S.ans[p+i]===x.a).length}/${a.length}</p>`}
function ans(k,j){S.ans[k]=j;show(cur,1)}
function tick(k){S.chk[k]=!S.chk[k];upd()}
function ck(k,t){return `<label class=ck><input type=checkbox ${S.chk[k]?'checked':''} onchange="tick('${k}')"> <span>${t}</span></label>`}
function upd(){$('#tp').textContent='Overall '+all()+'%';document.querySelectorAll('[data-p]').forEach(e=>e.innerHTML=bar(pct(+e.dataset.p)))}
function gotQ(n){const a=M[n].Q;return a.filter((x,i)=>S.ans['q'+(n+1)+'-'+i]===x.a).length+'/'+a.length}
function refl(k,q){return `<p><b>${q}</b></p><textarea oninput="S.ref['${k}']=this.value" placeholder="Type your answer…">${S.ref[k]||''}</textarea>`}
function modPage(i){const m=M[i],n=i+1;
let h=`<h1>Module ${n}: ${m.n}</h1><div data-p=${i}></div>
<details open><summary>Learning Objectives</summary><ul>${m.obj.map(o=>`<li>${o}</li>`).join('')}</ul></details>
<details open><summary>Learn</summary>${m.L.map((l,j)=>`<h3>${l[0]}</h3><p>${l[1]}</p>${ck('l'+n+'-'+j,'Mark as read')}`).join('')}</details>
<details open><summary>📒 Notes: Step-by-step in Photopea</summary>${NOTES[i].map(s=>`<h3>${s[0]}</h3><ol>${s[1].map(x=>`<li>${x}</li>`).join('')}</ol>`).join('')}${T('Menu names can differ slightly between Photopea versions. Use the Menu bar search if you cannot find an item.')}</details>`;
if(i==0)h+=`<details><summary>Demonstration: the 17 tools (tap a tool)</summary>${TOOLS.map(t=>`<details><summary>${t[1]} ${t[0]}</summary><p><b>Does:</b> ${t[2]}. <b>Use when:</b> ${t[3]}.</p>${X(t[4])}<p>🛠️ Try it: pick ${t[0]} and use it once on your image.</p></details>`).join('')}</details>
<details open><summary>Try It: Which Tool Should I Use?</summary>${quiz(SC,'t')}</details>`;
if(i==2)h+=`<details open><summary>Try It: Colour palette activity</summary><p>Choose the better palette for each poster.</p>${quiz(PAL,'c')}</details>
<details><summary>Demonstration: Before vs After</summary><div class=pz><div class=pos style="background:linear-gradient(red,yellow,lime);color:#0a0"><b style="font:700 2rem cursive;text-align:right;display:block">sale!!!</b><small style="font-family:serif">Lots of text placed anywhere with many fonts and low contrast</small></div><div class=pos style="background:#0b1d3a;color:#fff"><h2 style="margin:0 0 6px">Tech Night</h2><p style="margin:0 0 30px;color:#9ad">Friday 7 PM · Hall A</p><b style="background:#00c2ff;color:#0b1d3a;padding:4px 10px;border-radius:5px">Join now</b></div></div><p>Left: clashing colours, weak hierarchy. Right: 2 colours, clear title, aligned, spaced.</p></details>`;
h+=`<details open><summary>Exercise: ${m.lab[0]} (${m.lab[1]})</summary>${m.lab.slice(2).map((t,j)=>ck('e'+n+'-'+j,t)).join('')}${i==3?'<p><button class=btn onclick="show(7)">Open the project brief</button></p>':''}</details>`;
if(m.ch)h+=`<details><summary>Challenge</summary><p>${m.ch}</p></details>`;
h+=`<details open><summary>Quiz</summary>${quiz(m.Q,'q'+n+'-')}</details><details open><summary>Reflection</summary>${m.ref.map((q,j)=>refl('r'+n+j,q)).join('')}</details>`;return h}
function home(){return `<h1>Introduction to Photopea</h1><p>Learn image editing, design principles and responsible AI use through hands-on labs. Each lab fits a 2-hour session.</p><button class=btn onclick="show(1)">Start Learning</button>
<div class=grid>${M.map((m,i)=>`<div class=card><h3>${m.icon} Module ${i+1}</h3><p>${m.n}</p><div data-p=${i}></div><p>Quiz: ${gotQ(i)}</p><button class=btn onclick="show(${i+1})">Open</button></div>`).join('')}</div>
<h2>Achievements</h2><div class=grid>${M.map((m,i)=>`<div class="badge card ${pct(i)==100?'got':''}"><div>${m.icon}</div>${m.badge}</div>`).join('')}<div class="badge card ${projDone()?'got':''}"><div>🚀</div>Creative Designer</div></div>
<details><summary>2-hour lab structure</summary>${SES.map(s=>`<p><b>${s[0]} min</b> — ${s[1]}</p>`).join('')}</details>
<details><summary>Learning outcomes</summary><p>Use Photopea tools, edit images, apply effects and text styles, follow design principles, and use AI responsibly to create a poster.</p></details>`}
function ai(){return `<h1>Using AI Responsibly in Graphic Design</h1><p>Tools: Canva AI, Adobe Firefly, Microsoft Designer, ChatGPT, Gemini, Adobe Express AI, and background-removal in Photopea where available.</p>${R('AI can help generate ideas, but you remain responsible for the final design, editing, accuracy, originality and ethical use of content.')}
${AIA.map(a=>`<details open><summary>Activity ${a[0]}</summary><p><i>Prompt:</i> “${a[1]}”</p><p>${a[2]}</p><button class=btn onclick="navigator.clipboard&&navigator.clipboard.writeText('${a[1].replace(/'/g,'')}');this.textContent='Copied'">Copy prompt</button></details>`).join('')}
<h1>Design Knowledge Every Student Should Know</h1>${DK.map(d=>`<details><summary>${d[0]}</summary><p>${d[1]}</p></details>`).join('')}${T('Two complementary fonts are often easier to read than many.')}`}
function qz(){return M.map((m,i)=>`<h2>Module ${i+1} quiz</h2><div class=card>${quiz(m.Q,'q'+(i+1)+'-')}</div>`).join('')}
function fin(){return `<h1>Final Project: Create a Poster</h1><p>Choose a theme:</p><div>${TH.map((t,i)=>`<span class="chip ${S.theme==i?'on':''}" tabindex=0 onclick="S.theme=${i};show(7,1)">${t}</span>`).join('')}</div>
<div class=card><b>Requirements:</b> main title, supporting text, image, background, 4+ layers, image-editing technique, image effect, text effect, colour scheme, hierarchy, alignment, call-to-action, spacing.<br><b>Size:</b> A4 2480 × 3508 px (300 DPI) or 1080 × 1350 px.<br><b>Submit:</b> PSD, JPG/PNG, short design explanation.</div>
<h2>Self-evaluation checklist</h2><div class=card>${FQ.map((q,i)=>ck('p-'+i,q)).join('')}<p class=score>${FQ.filter((_,i)=>S.chk['p-'+i]).length}/${FQ.length} ${projDone()?'🚀 Project complete!':''}</p></div>
<h2>Rubric (tap a criterion)</h2><div class=card>${RB.map((r,i)=>`<button class=opt onclick="S.rub=${i};show(7,1)">${r[0]} — ${r[1]}%</button>${S.rub==i?`<p class=fb>${r[2]}</p>`:''}`).join('')}</div>`}
function show(p,keep){cur=p;const y=scrollY;$('#nav').innerHTML=PG.map((n,i)=>`<button class="${i==p?'on':''}" onclick="show(${i})">${n}</button>`).join('');
$('#app').innerHTML=[home,()=>modPage(0),()=>modPage(1),()=>modPage(2),()=>modPage(3),ai,qz,fin][p]();upd();scrollTo(0,keep?y:0)}
show(0);
</script></body></html>
